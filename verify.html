<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Testimonial - HALQA</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .verify-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 6px solid #0b3d91;
        }

        .logo {
            width: 80px;
            margin-bottom: 20px;
        }

        .status {
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            margin: 20px 0;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.revoked {
            background: #f8d7da;
            color: #721c24;
        }

        .status.not-found {
            background: #e2e3e5;
            color: #383d41;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            text-align: left;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .value {
            font-weight: 600;
            color: #333;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0b3d91;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="verify-card" id="card">
        <img src="/assets/logo.png" alt="HALQA Logo" class="logo">
        <h2>Certificate Verification</h2>
        <div id="loader" class="loader"></div>
        <div id="result" style="display: none;"></div>
    </div>

    <script type="module">
        import { firebaseConfig } from "./js/config/firebase-config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        async function verify() {
            const urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');
            const type = urlParams.get('type') || 'testimonial';
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');

            // Fallback for pretty URLs if implemented via redirects
            if (!id) {
                const pathParts = window.location.pathname.split('/');
                if (pathParts.length > 2) {
                    id = pathParts.slice(3).join('/'); // e.g. /verify/testimonial/CICK/TES/2026/000001
                }
            }

            if (!id) {
                loader.style.display = 'none';
                result.style.display = 'block';
                result.innerHTML = `<div class="status not-found">Invalid Verification Link</div><p>No Certificate ID provided.</p>`;
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const q = query(collection(db, "testimonials"), where("certificateNumber", "==", id));
                const querySnapshot = await getDocs(q);

                loader.style.display = 'none';
                result.style.display = 'block';

                if (!querySnapshot.empty) {
                    const data = querySnapshot.docs[0].data();
                    const isRevoked = data.status === "REVOKED" || data.status === "Revoked";

                    // Fetch student name from students collection if possible (not doing it here for speed, relying on payload)
                    // But payload only has studentId. We might need to fetch student name.
                    // Wait, I should update testimonials payload to include studentName to avoid extra joins on public page.

                    result.innerHTML = `
                    <div class="status ${isRevoked ? 'revoked' : 'active'}">Status: ${isRevoked ? 'REVOKED' : 'VALID'}</div>
                    <div class="detail-row"><span class="label">Certificate No:</span> <span class="value">${data.certificateNumber}</span></div>
                    <div class="detail-row"><span class="label">Session:</span> <span class="value">${data.session}</span></div>
                    <div class="detail-row"><span class="label">Period Attended:</span> <span class="value">${data.periodFrom} - ${data.periodTo}</span></div>
                    <div class="detail-row"><span class="label">Date Issued:</span> <span class="value">${new Date(data.issueDate).toLocaleDateString()}</span></div>
                `;
                } else {
                    result.innerHTML = `
                    <div class="status not-found">Certificate Not Found</div>
                    <p>This certificate ID does not exist in our secure registry.</p>
                `;
                }
            } catch (e) {
                console.error("Verification error:", e);
                loader.style.display = 'none';
                result.style.display = 'block';
                result.innerHTML = `<div class="status not-found">Network Error</div><p>Could not reach verification server.</p>`;
            }
        }

        verify();
    </script>

</body>

</html>
